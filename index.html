<style>
  /* ============ iOS-Systemfarben (Dark Mode) ============ */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --label: #FFFFFF;
    --label2: rgba(235,235,245,.62);
    --label3: rgba(235,235,245,.32);
    --sep: rgba(84,84,88,.55);
    --fill: rgba(120,120,128,.32);
    --fill2: rgba(120,120,128,.22);
    --fill3: rgba(118,118,128,.16);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A; --yellow: #FFD60A;
    --indigo: #5E5CE6; --purple: #BF5AF2; --pink: #FF375F; --teal: #40CBE0; --cyan: #64D2FF; --mint: #63E6E2; --gray: #8E8E93;
    --s-fix: var(--orange); --s-life: var(--blue); --s-save: var(--green);
    --glass: rgba(44,44,48,.46);
    --glass-strong: rgba(30,30,34,.62);
    --card: rgba(28,28,30,.58);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --spring: cubic-bezier(.34,1.36,.64,1);
    --ease: cubic-bezier(.32,.72,0,1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: var(--font);
    font-size: 17px; line-height: 1.29; letter-spacing: -.012em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-optical-sizing: auto;
    overscroll-behavior-y: none;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; letter-spacing: inherit; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .ms {
    font-family: "Material Symbols Rounded";
    font-weight: 400; font-style: normal; font-size: 22px; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
    direction: ltr; font-feature-settings: "liga";
    font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
    user-select: none; flex-shrink: 0;
  }
  .ms.line { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }

  /* ============ Hintergrund: ruhiges Licht hinter dem Glas ============ */
  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: #000; }
  .ambient i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .ambient .a1 { width: 520px; height: 520px; left: -180px; top: -160px; background: radial-gradient(circle, #0A3D91 0%, transparent 70%); }
  .ambient .a2 { width: 460px; height: 460px; right: -200px; top: 260px; background: radial-gradient(circle, #3B1F7A 0%, transparent 70%); opacity: .45; }
  .ambient .a3 { width: 520px; height: 520px; left: -120px; bottom: -220px; background: radial-gradient(circle, #0B4A55 0%, transparent 70%); opacity: .4; }

  /* ============ Liquid Glass ============ */
  .glass {
    position: relative; isolation: isolate;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -1px 0 rgba(255,255,255,.04),
      0 10px 30px rgba(0,0,0,.35);
  }
  /* Lichtkante: heller Rand oben links und unten rechts, wie bei echtem Glas */
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
    background: linear-gradient(140deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 28%, rgba(255,255,255,0) 50%, rgba(255,255,255,.06) 72%, rgba(255,255,255,.32));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* Glanzlicht innen */
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
    background: radial-gradient(120% 70% at 20% -10%, rgba(255,255,255,.12), transparent 55%);
  }
  .glass > * { position: relative; z-index: 3; }
  /* Echte Lichtbrechung (Chrome/Android): wird per Script aktiviert */
  .lg-on .glass.refract { -webkit-backdrop-filter: var(--lg-filter, blur(10px)) saturate(170%); backdrop-filter: var(--lg-filter, blur(10px)) saturate(170%); }

  .press { transition: transform .35s var(--spring), background-color .2s, opacity .2s; }
  .press:active { transform: scale(.96); transition-duration: .12s; }

  /* ============ Gerüst ============ */
  .app {
    position: relative; z-index: 1; max-width: 640px; margin: 0 auto; min-height: 100vh;
    padding: calc(52px + var(--safe-t)) 16px calc(118px + var(--safe-b));
    transform-origin: 50% 0; transition: transform .5s var(--ease), border-radius .5s var(--ease), filter .5s var(--ease);
  }
  .sheet-open .app { transform: scale(.94); border-radius: 22px; filter: brightness(.7); }

  /* Kopfzeile: unsichtbar oben, Glas-Verlauf beim Scrollen (wie iOS) */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: calc(52px + var(--safe-t)); padding-top: var(--safe-t);
    pointer-events: none;
  }
  .topbar .edge {
    position: absolute; inset: 0 0 -24px 0; opacity: 0; transition: opacity .25s;
    background: linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,.35) 70%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent);
    mask-image: linear-gradient(to bottom, #000 55%, transparent);
  }
  .topbar.scrolled .edge { opacity: 1; }
  .topbar .inner { position: relative; max-width: 640px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; gap: 10px; }
  .topbar .small-title {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) translateY(6px);
    font-size: 17px; font-weight: 600; letter-spacing: -.02em; opacity: 0; transition: opacity .2s, transform .3s var(--ease); white-space: nowrap;
  }
  .topbar.scrolled .small-title { opacity: 1; transform: translate(-50%, -50%); }
  .gbtn {
    pointer-events: auto; width: 40px; height: 40px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; color: var(--label);
  }
  .gbtn .ms { font-size: 21px; }
  .gbtn.spin .ms { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .large-title { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.03em; margin: 2px 4px 14px; transition: opacity .2s; }
  .ptr { height: 0; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; color: var(--label2); }
  .ptr .ms { transition: transform .2s; }

  main { position: relative; }
  .view { animation: viewIn .45s var(--ease) both; }
  .view.static { animation: none; }
  .view.from-r { animation-name: fromR; }
  .view.from-l { animation-name: fromL; }
  @keyframes viewIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes fromR { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes fromL { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }

  /* ============ Abschnitte & Listen (Inset Grouped) ============ */
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 4px 8px; }
  .sec-h h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.025em; }
  .sec-h .aside { font-size: 15px; color: var(--label2); }
  .sec-h .link { font-size: 17px; color: var(--blue); }
  .sec-f { font-size: 13px; line-height: 18px; color: var(--label2); margin: 7px 16px 0; }

  .group { border-radius: 26px; overflow: hidden; background: var(--card); }
  .group.glass { background: var(--card); }
  .cell {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; width: 100%; text-align: left;
    position: relative;
  }
  .cell + .cell::before, .cell-wrap + .cell-wrap::before {
    content: ""; position: absolute; top: 0; right: 0; left: var(--sep-l, 16px); height: .5px; background: var(--sep);
  }
  .cell-wrap { position: relative; }
  .group.icons { --sep-l: 60px; }
  button.cell:active, .cell-wrap > button.cell:active { background: rgba(255,255,255,.07); }
  .cell .name { flex: 1; min-width: 0; color: var(--label); }
  .cell .name.dim { color: var(--label2); }
  .cell .val { color: var(--label2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cell.total .name { font-weight: 600; }
  .cell.total .val { color: var(--label); font-weight: 600; }
  .cell .op { width: 14px; color: var(--label3); text-align: center; margin-right: -4px; }
  .cell .chev { color: var(--label3); font-size: 20px; margin-right: -6px; transition: transform .35s var(--spring); }
  .cell-wrap.open .chev { transform: rotate(90deg); }

  .tile {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: var(--tile, var(--gray));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -8px 14px rgba(0,0,0,.12);
  }
  .tile .ms { font-size: 19px; }
  .tile.txt { font-size: 12px; font-weight: 700; letter-spacing: -.01em; }

  .two { flex: 1; min-width: 0; display: block; }
  .two .t { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .two .t.wrap { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
  .two .s { font-size: 15px; color: var(--label2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trail { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .trail b { display: block; font-weight: 600; font-size: 17px; }
  .trail small { display: block; font-size: 13px; color: var(--label2); margin-top: 1px; }

  /* Ausklappbereich (Monate) */
  .disclose { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .cell-wrap.open .disclose { grid-template-rows: 1fr; }
  .disclose > div { overflow: hidden; }
  .disclose .inner { margin: 0 12px 12px 60px; border-radius: 18px; background: var(--fill3); --sep-l: 14px; }
  .disclose .cell { min-height: 40px; padding: 8px 14px; font-size: 15px; }
  .disclose .note { margin: 0 12px 12px 60px; }
  .disclose .actions { margin: 0 12px 14px 60px; }

  /* ============ Pillen, Buttons, Hinweise ============ */
  .pill {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap;
    background: var(--fill2); color: var(--label2);
  }
  .pill.orange { background: rgba(255,159,10,.2); color: var(--orange); }
  .pill.green { background: rgba(48,209,88,.18); color: var(--green); }
  .pill.blue { background: rgba(10,132,255,.2); color: #4BA3FF; }
  .pill .ms { font-size: 15px; }

  .btn-tinted {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 20px; border-radius: 999px;
    background: rgba(10,132,255,.2); color: #4BA3FF; font-weight: 600; font-size: 17px;
  }
  .btn-plain { color: var(--blue); font-size: 17px; display: inline-flex; align-items: center; gap: 4px; height: 36px; }
  .btn-plain .ms { font-size: 18px; }

  .note {
    display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: var(--fill3);
    font-size: 15px; line-height: 20px; color: var(--label2);
  }
  .note .ms { color: var(--blue); font-size: 19px; margin-top: 1px; }
  .note.orange { background: rgba(255,159,10,.14); color: #FFC56B; }
  .note.orange .ms { color: var(--orange); }
  .note.green { background: rgba(48,209,88,.13); color: #7EE59A; }
  .note.green .ms { color: var(--green); }
  .note b { color: var(--label); font-weight: 600; }

  /* ============ Hero ============ */
  .hero { border-radius: 30px; padding: 20px 20px 18px; overflow: hidden; }
  .hero.glass { background: linear-gradient(150deg, rgba(10,132,255,.42), rgba(94,92,230,.22) 55%, rgba(40,40,48,.4)); }
  .hero.glass.neutral { background: linear-gradient(150deg, rgba(255,159,10,.30), rgba(255,69,58,.12) 60%, rgba(40,40,48,.42)); }
  .hero .eyebrow { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,.82); }
  .hero .eyebrow .ms { font-size: 18px; }
  .hero .big {
    font-size: 54px; line-height: 1; font-weight: 700; letter-spacing: -.045em; margin: 12px 0 6px;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 24px rgba(0,0,0,.25);
  }
  .hero .big .dec { font-size: 28px; letter-spacing: -.02em; font-weight: 600; opacity: .82; margin-left: 1px; }
  .hero.compact .big { font-size: 40px; }
  .hero .sub { font-size: 15px; color: rgba(255,255,255,.72); }
  .hero .rows { margin-top: 14px; }
  .hero .cell { padding: 10px 0; min-height: 0; }
  .hero .cell + .cell::before { left: 0; background: rgba(255,255,255,.14); }
  .hero .cell .name { color: rgba(255,255,255,.8); }
  .hero .cell .val { color: #fff; }

  .split { display: flex; gap: 3px; height: 10px; margin: 18px 0 14px; border-radius: 999px; overflow: hidden; }
  .split i { display: block; height: 100%; border-radius: 999px; transform-origin: left; animation: grow .9s var(--ease) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .legend { display: grid; gap: 10px; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .legend-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-row .name { flex: 1; color: rgba(255,255,255,.85); }
  .legend-row .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend-row .pct { width: 40px; text-align: right; font-size: 13px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }

  /* Monatswechsler */
  .month-switch { display: flex; align-items: center; justify-content: space-between; height: 54px; border-radius: 999px; padding: 0 6px; margin-bottom: 14px; }
  .month-switch .label { text-align: center; line-height: 1.15; }
  .month-switch .label b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .month-switch .label span { font-size: 13px; color: var(--label2); }
  .month-switch .gbtn { width: 42px; height: 42px; color: var(--blue); }
  .month-switch .gbtn[disabled] { opacity: .25; pointer-events: none; }
  .month-switch .gbtn:active { background: rgba(255,255,255,.1); }

  /* Kennzahl in Gruppen */
  .kpi-cell { padding: 16px 16px 12px; }
  .kpi-cell .k { font-size: 34px; font-weight: 700; letter-spacing: -.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .kpi-cell .l { font-size: 15px; color: var(--label2); margin-top: 3px; }
  .progress { height: 6px; border-radius: 999px; background: var(--fill2); overflow: hidden; margin: 12px 16px 8px; }
  .progress i { display: block; height: 100%; border-radius: 999px; background: var(--green); min-width: 6px; transform-origin: left; animation: grow .9s var(--ease) both; }
  .pad { padding: 0 16px 14px; }

  /* Termine */
  .date-tile {
    width: 44px; height: 48px; border-radius: 12px; flex-shrink: 0; background: var(--fill3);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  .date-tile span { font-size: 11px; font-weight: 600; color: var(--red); margin-bottom: 3px; }
  .date-tile b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

  /* ============ Segmented Control ============ */
  .segmented { position: relative; display: flex; height: 36px; padding: 3px; border-radius: 999px; margin: 0 0 16px; }
  .segmented .thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 999px; z-index: 0;
    background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 8px rgba(0,0,0,.25);
    transition: transform .45s var(--spring), width .3s var(--ease);
  }
  .segmented button { position: relative; z-index: 1; flex: 1; font-size: 15px; font-weight: 600; color: var(--label2); border-radius: 999px; }
  .segmented button.on { color: var(--label); }

  /* Filter-Kapseln */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 4px; padding: 4px 16px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .fchip { flex-shrink: 0; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--label); }
  .fchip.on { color: #fff; }
  .fchip.on.glass { background: rgba(10,132,255,.62); }

  /* ============ Diagramm ============ */
  .chart-cap { display: flex; justify-content: space-between; align-items: flex-end; padding: 16px 16px 6px; }
  .chart-cap .m { font-size: 13px; color: var(--label2); }
  .chart-cap .v { font-size: 34px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .chart-cap .r { text-align: right; }
  .chart-cap .r b { display: block; font-size: 17px; font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }
  .chart-wrap { padding: 4px 12px 12px; }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart text { font-family: var(--font); fill: var(--label2); font-size: 11px; font-weight: 500; }
  svg.chart .grid { stroke: rgba(255,255,255,.12); stroke-width: 1; stroke-dasharray: 2 3; }
  svg.chart .bar { fill: rgba(10,132,255,.38); transition: fill .2s; }
  svg.chart .bar.on { fill: var(--blue); }
  svg.chart .ghost { fill: none; stroke: rgba(255,255,255,.18); stroke-dasharray: 2 3; }
  svg.chart .hit { fill: transparent; cursor: pointer; }

  /* ============ Tab Bar (schwebend, Liquid Glass) ============ */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; pointer-events: none;
    padding: 0 16px calc(14px + var(--safe-b));
    transition: transform .5s var(--ease);
  }
  .sheet-open .tabbar { transform: translateY(140%); }
  .tabbar .bar {
    pointer-events: auto; max-width: 420px; margin: 0 auto; height: 64px; border-radius: 999px;
    display: flex; padding: 4px; background: var(--glass-strong);
  }
  .tabbar .lens {
    position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; z-index: 2;
    background: rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.25);
    transition: transform .55s var(--spring), width .3s var(--ease);
  }
  .tabbar .lens.squish { animation: squish .55s var(--ease); }
  @keyframes squish { 35% { scale: 1.12 .9; } }
  .tabbar button {
    flex: 1; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 10px; font-weight: 600; letter-spacing: .005em; color: var(--label); border-radius: 999px;
    transition: color .25s;
  }
  .tabbar button .ms { font-size: 25px; transition: transform .45s var(--spring); }
  .tabbar button.on { color: var(--blue); }
  .tabbar button:active .ms { transform: scale(.86); }

  /* ============ Sheet (iOS 27) ============ */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); z-index: 50; max-width: 624px; margin: 0 auto;
    border-radius: 38px; max-height: 84vh; overflow-y: auto; overscroll-behavior: contain;
    padding: 6px 20px 24px; background: rgba(36,36,40,.72);
    -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 60px rgba(0,0,0,.6);
    transform: translateY(calc(100% + 40px)); transition: transform .55s var(--ease);
    scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet.show { transform: none; }
  .sheet.drag { transition: none; }
  .sheet .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 4px auto 6px; }
  .sheet .close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; z-index: 5;
    display: flex; align-items: center; justify-content: center; color: var(--label2); background: var(--fill2);
  }
  .sheet .close .ms { font-size: 19px; }
  .sheet h3 { margin: 10px 44px 2px 0; font-size: 22px; line-height: 27px; font-weight: 700; letter-spacing: -.025em; }
  .sheet .meta { color: var(--label2); font-size: 15px; }
  .sheet .amount { font-size: 40px; font-weight: 700; letter-spacing: -.04em; margin: 14px 0 16px; font-variant-numeric: tabular-nums; }
  .sheet .amount small { font-size: 17px; font-weight: 400; color: var(--label2); letter-spacing: -.01em; }
  .sheet .group { background: var(--fill3); border-radius: 20px; }
  .sheet .note { margin-top: 12px; }
  .sheet .head { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
  .sheet .head .tile { width: 44px; height: 44px; border-radius: 12px; }
  .sheet .head .tile .ms { font-size: 25px; }
  .sheet .head h3 { margin: 0 44px 0 0; }

  /* ============ Zustände ============ */
  .skel { border-radius: 26px; margin-bottom: 14px; background: var(--card); position: relative; overflow: hidden; }
  .skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); animation: shimmer 1.4s infinite; transform: translateX(-100%); }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .center-state { text-align: center; padding: 56px 24px; }
  .center-state .ms { font-size: 52px; color: var(--label3); }
  .center-state h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 14px 0 6px; }
  .center-state p { color: var(--label2); font-size: 15px; margin: 0 0 20px; }
  .footer { text-align: center; font-size: 13px; color: var(--label3); padding: 26px 0 4px; }

  .toast {
    position: fixed; left: 50%; top: calc(10px + var(--safe-t)); z-index: 70; height: 44px; padding: 0 18px 0 14px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;
    transform: translate(-50%, -90px) scale(.8); opacity: 0; transition: transform .55s var(--spring), opacity .3s;
  }
  .toast .ms { color: var(--green); font-size: 20px; }
  .toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="lgDefs"></defs></svg>

<header class="topbar" id="topbar">
  <div class="edge"></div>
  <div class="inner">
    <div class="small-title" id="smallTitle">Finanzen</div>
    <button class="gbtn glass refract press" id="btnRefresh" aria-label="Aktualisieren" data-lg="btn"><span class="ms line">refresh</span></button>
    <button class="gbtn glass refract press" id="btnSheet" aria-label="Tabelle öffnen" data-lg="btn"><span class="ms line">table_view</span></button>
  </div>
</header>

<div class="app" id="app">
  <div class="ptr" id="ptr"><span class="ms line">arrow_downward</span></div>
  <h1 class="large-title" id="title">Finanzen</h1>
  <main id="main"></main>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="bar glass refract" id="tabbarGlass" data-lg="tab">
    <span class="lens" id="lens"></span>
    <button data-tab="home" class="on"><span class="ms">home</span>Übersicht</button>
    <button data-tab="monate"><span class="ms">payments</span>Einkommen</button>
    <button data-tab="fix"><span class="ms">receipt_long</span>Fixkosten</button>
    <button data-tab="haus"><span class="ms">cottage</span>Haus</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast glass" id="toast"><span class="ms">check_circle</span><span id="toastText"></span></div>

<script>
(function () {
  'use strict';

  /* ================= Helfer ================= */
  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const eurFmt = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  const numFmt = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = n => n == null ? '–' : eurFmt.format(n);
  const has = n => typeof n === 'number' && isFinite(n);
  function eurBig(n) {
    if (!has(n)) return '–';
    const s = numFmt.format(n); const i = s.lastIndexOf(',');
    return esc(s.slice(0, i)) + '<span class="dec">' + esc(s.slice(i)) + ' €</span>';
  }
  function parseDate(iso) { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
  // Lohn kommt Ende des Vormonats und zählt für den Folgemonat: ab dem 25. zeigt die App schon den nächsten Monat.
  function budgetMonth(iso) { const t = parseDate(iso); return t.getDate() >= 25 ? new Date(t.getFullYear(), t.getMonth() + 1, 1) : t; }
  function inDays(d) {
    if (d === 0) return 'heute';
    if (d === 1) return 'morgen';
    if (d < 0) return 'vorbei';
    if (d < 14) return 'in ' + d + ' Tagen';
    if (d < 60) return 'in ' + Math.round(d / 7) + ' Wochen';
    return 'in ' + Math.round(d / 30) + ' Monaten';
  }
  const weekday = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const haptic = ms => { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} };

  // Kategorie → Symbol und iOS-Farbe (wie die Kacheln in den iOS-Einstellungen)
  const CAT = {
    'wohnen': ['home', 'var(--orange)'], 'versicherung': ['shield', 'var(--green)'], 'wohnen / versicherung': ['shield', 'var(--green)'],
    'abo': ['play_circle', 'var(--pink)'], 'finanzierung': ['account_balance', 'var(--indigo)'], 'telekommunikation': ['wifi', 'var(--blue)'],
    'auto': ['directions_car', 'var(--red)'], 'kostenbeteiligung': ['group', 'var(--teal)'], 'katzen': ['pets', 'var(--yellow)'], 'bank': ['account_balance', 'var(--gray)']
  };
  const catOf = c => CAT[String(c).toLowerCase()] || ['payments', 'var(--gray)'];
  const tile = (icon, color) => '<span class="tile" style="--tile:' + color + '"><span class="ms">' + icon + '</span></span>';

  /* ================= Zustand ================= */
  const state = { data: null, tab: 'home', y: 0, m: 0, chartYear: 0, chartSel: null, openMonth: null, filter: 'Alle' };

  /* ================= Daten laden ================= */
  function load(isRefresh) {
    const btn = $('#btnRefresh');
    btn.classList.add('spin');
    if (!state.data) renderSkeleton();
    const done = json => {
      btn.classList.remove('spin'); ptrDone();
      try {
        state.data = typeof json === 'string' ? JSON.parse(json) : json;
        initPosition(!isRefresh);
        render();
        if (isRefresh) toast('Aktualisiert');
      } catch (e) { renderError(e); }
    };
    const fail = err => { btn.classList.remove('spin'); ptrDone(); if (state.data) toast('Aktualisieren fehlgeschlagen', true); else renderError(err); };
    if (window.FINANZEN_DATA_URL) {
      fetch(window.FINANZEN_DATA_URL, { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(done, fail);
    } else if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).getData();
    } else if (window.__PREVIEW_DATA__) {
      setTimeout(() => done(window.__PREVIEW_DATA__), isRefresh ? 500 : 0);
    } else {
      fail(new Error('Keine Datenverbindung'));
    }
  }

  function initPosition(first) {
    const d = state.data; if (!d.years.length) return;
    const t = budgetMonth(d.today);
    if (first) {
      let yi = d.years.findIndex(y => y.year === t.getFullYear());
      if (yi < 0) yi = d.years.length - 1;
      state.y = yi; state.m = t.getMonth(); state.chartYear = yi;
    }
    state.y = Math.min(state.y, d.years.length - 1);
    state.chartYear = Math.min(state.chartYear, d.years.length - 1);
  }

  /* ================= Rendering ================= */
  const TITLES = { home: 'Finanzen', monate: 'Einkommen', fix: 'Fixkosten', haus: 'Haus & Miete' };
  function render(anim) {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    moveLens();
    $('#title').textContent = TITLES[state.tab];
    $('#smallTitle').textContent = TITLES[state.tab];
    const fn = { home: viewHome, monate: viewMonate, fix: viewFix, haus: viewHaus }[state.tab];
    $('#main').innerHTML = '<div class="view' + (anim ? ' ' + anim : '') + '">' + fn() + footer() + '</div>';
    placeThumbs();
    refreshGlass();
  }

  function footer() {
    const u = state.data && state.data.updated ? state.data.updated.slice(11, 16) : '';
    return '<div class="footer">Aktualisiert um ' + esc(u) + ' Uhr</div>';
  }

  function renderSkeleton() {
    $('#main').innerHTML = '<div class="skel" style="height:54px;border-radius:999px"></div><div class="skel" style="height:290px;border-radius:30px"></div><div class="skel" style="height:150px"></div><div class="skel" style="height:220px"></div>';
  }
  function renderError(err) {
    $('#main').innerHTML = '<div class="center-state"><span class="ms">cloud_off</span><h2>Keine Verbindung zur Tabelle</h2><p>' +
      esc(err && err.message ? err.message : err) + '</p><button class="btn-tinted press" data-action="retry"><span class="ms">refresh</span>Erneut laden</button></div>';
  }

  // Hilfsbausteine für Listen
  function cell(name, v, cls) {
    return '<div class="cell' + (cls ? ' ' + cls : '') + '"><span class="name">' + esc(name) + '</span><span class="val">' + (has(v) ? esc(eur(v)) : '–') + '</span></div>';
  }
  const row = cell;
  function cellText(n, v) { return '<div class="cell"><span class="name">' + esc(n) + '</span><span class="val" style="white-space:normal;text-align:right">' + esc(v) + '</span></div>'; }
  function secHead(title, aside) { return '<div class="sec-h"><h2>' + esc(title) + '</h2>' + (aside || '') + '</div>'; }

  /* ---------- Übersicht ---------- */
  function curMonth() { const y = state.data.years[state.y]; return { year: y.year, mo: y.months[state.m] }; }
  function monthHasIncome(mo) { return has(mo.hauptjob) || has(mo.nebenjob); }

  function viewHome() {
    const d = state.data;
    if (!d.years.length) return '<div class="center-state"><span class="ms">info</span><h2>Kein Jahresblatt gefunden</h2></div>';
    const { year, mo } = curMonth();
    const first = state.y === 0 && state.m === 0;
    const last = state.y === d.years.length - 1 && state.m === 11;
    const bm = budgetMonth(d.today); const isNow = bm.getFullYear() === year && bm.getMonth() === state.m;

    let h = '<div class="month-switch glass refract" data-lg="cap">' +
      '<button class="gbtn press" data-action="prev" aria-label="Vorheriger Monat"' + (first ? ' disabled' : '') + '><span class="ms">chevron_left</span></button>' +
      '<div class="label"><b>' + esc(MONTHS[state.m]) + ' ' + year + '</b><span>' + (isNow ? 'Aktueller Monat' : 'Wischen oder Pfeile') + '</span></div>' +
      '<button class="gbtn press" data-action="next" aria-label="Nächster Monat"' + (last ? ' disabled' : '') + '><span class="ms">chevron_right</span></button></div>';

    if (monthHasIncome(mo)) {
      // Dauerauftrag (Spalte G) enthält das Sparen schon; „Zum Leben“ (Spalte I) ist Einkommen minus Dauerauftrag.
      const inc = mo.einnahmen || 0, save = mo.sparen || 0;
      const fix = (mo.ueberweisung || 0) - save;
      const life = has(mo.leben) ? mo.leben : inc - fix - save;
      const segs = [
        { n: 'Dauerauftrag Fixkosten', v: fix, c: 'var(--s-fix)' },
        { n: 'Zum Leben', v: Math.max(life, 0), c: 'var(--s-life)' },
        { n: 'Sparen', v: save, c: 'var(--s-save)' }
      ];
      const tot = segs.reduce((a, s) => a + s.v, 0) || 1;
      h += '<section class="hero glass"><div class="eyebrow"><span class="ms">account_balance_wallet</span>Zum Leben übrig</div>' +
        '<div class="big">' + eurBig(life) + '</div>' +
        '<div class="sub">von ' + esc(eur(inc)) + ' Einkommen, nach Dauerauftrag' + (save ? ' und Sparen' : '') + '</div>' +
        '<div class="split" role="img" aria-label="Aufteilung des Einkommens">' +
        segs.filter(s => s.v > 0).map((s, k) => '<i style="flex:' + s.v + ';background:' + s.c + ';animation-delay:' + (k * 80) + 'ms"></i>').join('') + '</div>' +
        '<div class="legend">' + segs.filter(s => s.v > 0 || s.n !== 'Sparen').map(s =>
          '<div class="legend-row"><span class="dot" style="background:' + s.c + '"></span><span class="name">' + esc(s.n) + '</span>' +
          '<span class="val">' + esc(eur(s.v)) + '</span><span class="pct">' + Math.round(s.v / tot * 100) + ' %</span></div>').join('') +
        '</div></section>';
    } else {
      h += '<section class="hero glass neutral compact"><div class="eyebrow"><span class="ms">schedule</span>Lohn noch nicht eingetragen</div>' +
        '<div class="big">' + eurBig(mo.ueberweisung) + '</div>' +
        '<div class="sub">Dauerauftrag für ' + esc(MONTHS[state.m]) + '. Sobald dein Lohn da ist, sag Claude Bescheid, dann steht hier, was zum Leben bleibt.</div></section>';
    }

    // Einkommen
    if (monthHasIncome(mo)) {
      h += secHead('Einkommen') + '<div class="group glass">' +
        cell('Hauptjob', mo.hauptjob) + cell('Nebenjob', mo.nebenjob) + cell('Gesamt aufs Hauptkonto', mo.einnahmen, 'total') + '</div>';
    }

    // Fixkostenkonto
    h += secHead('Fixkostenkonto') + '<div class="group glass">' +
      '<div class="cell"><span class="op"></span><span class="name">Fixkosten (Ausgaben)</span><span class="val">' + esc(eur(mo.ausgaben)) + '</span></div>' +
      '<div class="cell"><span class="op">−</span><span class="name">Miete & Beteiligungen</span><span class="val">' + esc(eur(mo.eingaenge)) + '</span></div>' +
      (mo.sparen ? '<div class="cell"><span class="op">+</span><span class="name">Sparen</span><span class="val">' + esc(eur(mo.sparen)) + '</span></div>' : '') +
      '<div class="cell total"><span class="op">=</span><span class="name">Dauerauftrag</span><span class="val">' + esc(eur(mo.ueberweisung)) + '</span></div></div>';

    h += cardTermine();
    h += cardPrivat();
    h += cardSpardose();
    h += cardSparplan(mo);
    return h;
  }

  function upcoming() {
    const d = state.data; return (d.termine || []).filter(t => t.konto !== 'SPARDOSE' && daysBetween(d.today, t.datum) >= 0);
  }

  function termItem(t, i) {
    const dt = parseDate(t.datum); const dd = daysBetween(state.data.today, t.datum);
    const big = has(t.betrag) && t.betrag >= 1000;
    return '<button class="cell press-row" data-action="termin" data-i="' + i + '">' +
      '<span class="date-tile"><span>' + MONTHS_SHORT[dt.getMonth()] + '</span><b>' + dt.getDate() + '</b></span>' +
      '<span class="two"><span class="t wrap" style="display:-webkit-box">' + esc(t.was) + '</span><span class="s" style="display:block">' + esc(t.konto || t.hinweis || '') + '</span></span>' +
      '<span class="trail">' + (has(t.betrag) ? '<b>' + esc(eur(t.betrag)) + '</b>' : '') +
      '<span class="pill ' + (dd <= 7 || big ? 'orange' : '') + '" style="margin-top:4px">' + esc(inDays(dd)) + '</span></span></button>';
  }

  function cardTermine() {
    const up = upcoming();
    if (!up.length) return '';
    const all = state.data.termine;
    let h = secHead('Als Nächstes', up.length > 4 ? '<button class="link" data-action="alltermine">Alle ' + up.length + '</button>' : '') +
      '<div class="group glass" style="--sep-l:72px">';
    up.slice(0, 4).forEach(t => { h += termItem(t, all.indexOf(t)); });
    return h + '</div>';
  }

  function cardSpardose() {
    const t = (state.data.termine || []).filter(x => x.konto === 'SPARDOSE');
    if (t.length < 3) return '';
    const dose = t[0], schuld = t[1], gesamt = t[2];
    let h = secHead('Spardose für den Urlaub') + '<div class="group glass">' +
      '<div class="kpi-cell"><div class="k">' + esc(eur(dose.betrag)) + '</div><div class="l">Bargeld in der Dose</div></div>';
    if (schuld.betrag > 0) h += cell('Muss noch zurückgelegt werden', schuld.betrag);
    h += cell('Urlaubsgeld insgesamt', gesamt.betrag, 'total') + '</div>';
    if (schuld.betrag > 0 && schuld.hinweis) h += '<div class="note orange" style="margin-top:10px"><span class="ms">undo</span><div>' + esc(schuld.hinweis) + '</div></div>';
    return h;
  }

  function cardPrivat() {
    const p = state.data.privat; if (!p || !p.rows || !p.rows.length) return '';
    let h = secHead('Privates Sparkonto') + '<div class="group glass">' +
      '<div class="kpi-cell"><div class="k">' + esc(eur(p.stand)) + '</div><div class="l">Aktueller Stand</div></div>';
    p.rows.slice(-4).reverse().forEach(r => {
      h += '<div class="cell"><span class="two"><span class="t wrap" style="display:-webkit-box;font-size:15px">' + esc(r.was) + '</span><span class="s" style="display:block;font-size:13px">' + esc(r.datum) + (r.geplant ? ' (geplant)' : '') + '</span></span>' +
        '<span class="val" style="color:' + (r.betrag < 0 ? 'var(--label2)' : 'var(--green)') + '">' + (r.betrag > 0 ? '+' : '') + esc(eur(r.betrag)) + '</span></div>';
    });
    return h + '</div><div class="sec-f">Jeden Monat landet hier, was vor dem Lohn auf dem Hauptkonto übrig war.</div>';
  }

  function cardSparplan(mo) {
    const s = state.data.sparplan || {};
    if (!has(s.nachholbedarf) && !has(s.rate)) return '';
    const stand = has(s.stand) ? s.stand : 0;
    const goal = s.nachholbedarf || 0;
    const pct = goal ? Math.min(stand / goal, 1) : 0;
    const paused = !mo.sparen;
    let h = secHead('Sparplan', paused ? '<span class="pill orange"><span class="ms">pause</span>pausiert</span>' : '<span class="pill green"><span class="ms">check</span>aktiv</span>') +
      '<div class="group glass"><div class="kpi-cell"><div class="k">' + esc(eur(stand)) + '</div><div class="l">auf dem Sparkonto</div></div>' +
      '<div class="progress" role="progressbar" aria-valuenow="' + Math.round(pct * 100) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + (pct * 100) + '%"></i></div>' +
      '<div class="pad" style="font-size:13px;color:var(--label2)">Nachholen: ' + esc(eur(goal)) + ' (' + esc(eur(s.entnahme)) + ' Entnahme + ' + esc(eur(s.pausiert)) + ' ausgefallene Raten)</div></div>';
    if (s.rateLabel) h += '<div class="note" style="margin-top:10px"><span class="ms">event_repeat</span><div>' + esc(s.rateLabel) + ': <b>' + esc(eur(s.rate)) + '</b> im Monat (50 € Reparaturen + 75 € Finanzamt)</div></div>';
    return h;
  }

  /* ---------- Einkommen ---------- */
  function viewMonate() {
    const d = state.data; const Y = d.years[state.chartYear];
    let h = '';
    if (d.years.length > 1) {
      h += '<div class="segmented glass refract" data-lg="cap" data-n="' + d.years.length + '" data-sel="' + state.chartYear + '"><span class="thumb"></span>' + d.years.map((y, i) =>
        '<button data-action="year" data-i="' + i + '" class="' + (i === state.chartYear ? 'on' : '') + '">' + y.year + '</button>').join('') + '</div>';
    }
    const filled = Y.months.map((m, i) => ({ m, i })).filter(x => monthHasIncome(x.m));
    const sum = k => filled.reduce((a, x) => a + (x.m[k] || 0), 0);

    // Diagramm
    let sel = state.chartSel;
    if (sel == null || !monthHasIncome(Y.months[sel])) sel = filled.length ? filled[filled.length - 1].i : null;
    h += '<div class="group glass">' +
      '<div class="chart-cap"><div><div class="m">Zum Leben · ' + (sel != null ? esc(MONTHS[sel]) + ' ' + Y.year : 'noch keine Daten') + '</div>' +
      '<div class="v">' + (sel != null ? esc(eur(Y.months[sel].leben)) : '–') + '</div></div>' +
      (sel != null ? '<div class="r"><div class="m">Netto</div><b>' + esc(eur(Y.months[sel].einnahmen)) + '</b></div>' : '') + '</div>' +
      '<div class="chart-wrap">' + chartSvg(Y, sel) + '</div></div>';

    // Summen
    if (filled.length) {
      const range = MONTHS_SHORT[filled[0].i] + (filled.length > 1 ? ' bis ' + MONTHS_SHORT[filled[filled.length - 1].i] : '');

  function chartSvg(Y, sel) {

    const max = Math.max(500, ...vals.filter(v => v != null));
    const step = max > 2500 ? 1000 : 500;
    const yMax = Math.ceil(max / step) * step;
    const cw = (W - padL) / 12, bw = Math.min(16, cw - 8);
    const yPx = v => top + (H - padB - top) * (1 - v / yMax);
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Zum Leben pro Monat">';
    for (let g = 0; g <= yMax; g += step) {

      s += '<line class="grid" x1="' + padL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text x="0" y="' + (y + 4) + '" text-anchor="start">' + g.toLocaleString('de-DE') + ' €</text>';
    }
    vals.forEach((v, i) => {
      const cx = padL + cw * i + cw / 2; const x = cx - bw / 2; const base = yPx(0);

      if (v != null) s += '<rect class="hit" data-action="bar" data-i="' + i + '" x="' + (cx - cw / 2) + '" y="0" width="' + cw + '" height="' + H + '"><title>' + MONTHS[i] + ': ' + eur(v) + '</title></rect>';

  /* ================= Liquid Glass: Lichtbrechung ================= */

  if (LG) document.documentElement.classList.add('lg-on');

      const ox = Math.max(qx, 0), oy = Math.max(qy, 0);

  };
  window.addEventListener('scroll', onScroll, { passive: true });

  // Wischen in der Übersicht wechselt den Monat; Ziehen ganz oben lädt neu (wie iOS)
  let sx = null, sy = null, pulling = false;
  const ptr = $('#ptr');
  document.addEventListener('touchstart', e => {
    if (e.target.closest('.sheet') || e.target.closest('.tabbar') || e.target.closest('.chips')) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; pulling = window.scrollY <= 0;
    if (pulling) ptr.style.transition = 'none';
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (sx == null || !pulling) return;
    const dy = e.touches[0].clientY - sy;
    if (dy > 0 && Math.abs(e.touches[0].clientX - sx) < dy) {
      const h = Math.min(dy * .45, 70); ptr.style.height = h + 'px';
      ptr.querySelector('.ms').style.transform = 'rotate(' + (h >= 56 ? 180 : 0) + 'deg)';
    }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (pulling && parseFloat(ptr.style.height || 0) >= 56) {
      ptr.style.transition = 'height .3s'; ptr.style.height = '44px'; ptr.querySelector('.ms').textContent = 'progress_activity';
      ptr.querySelector('.ms').style.animation = 'spin .9s linear infinite'; haptic(10); load(true);
    } else if (pulling) { ptr.style.transition = 'height .3s var(--ease)'; ptr.style.height = '0'; }
    pulling = false;
    if (state.tab === 'home' && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, { passive: true });
  function ptrDone() {
    ptr.style.transition = 'height .35s var(--ease)'; ptr.style.height = '0';
    const ic = ptr.querySelector('.ms'); setTimeout(() => { ic.textContent = 'arrow_downward'; ic.style.animation = ''; ic.style.transform = ''; }, 350);
  }

  // Sheet mit dem Finger nach unten ziehen (folgt dem Finger, federt zurück)
  const sheet = $('#sheet'); let shY = null, shD = 0, shT = 0;
  sheet.addEventListener('touchstart', e => { shY = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; shD = 0; shT = Date.now(); }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (shY == null) return;
    shD = e.touches[0].clientY - shY;
    if (shD > 0) { sheet.classList.add('drag'); sheet.style.transform = 'translateY(' + shD + 'px)'; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (shY == null) return;
    sheet.classList.remove('drag');
    const v = shD / Math.max(1, Date.now() - shT);
    if (shD > 110 || (shD > 30 && v > .6)) closeSheet(); else sheet.style.transform = '';
    shY = null;
  }, { passive: true });

  let toastT;
  function toast(msg, bad) {
    const t = $('#toast'); $('#toastText').textContent = msg;
    t.querySelector('.ms').textContent = bad ? 'error' : 'check_circle';
    t.querySelector('.ms').style.color = bad ? 'var(--red)' : '';
    t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  moveLens(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveLens(true); placeThumbs(); refreshGlass(); });
  load(false);
})();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
